name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # 项目固定 JVM toolchain 25（Kotlin jvmTarget 25），CI JDK 必须对齐
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # 依赖 + 构建缓存（与 CI 同一套 actions 缓存）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 正式签名：从 Actions secrets 还原 keystore 与 keystore.properties；
      # secrets 未配置时跳过，release 回退 debug 签名（与本地构建行为一致）
      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore/minibgm-release.jks
            cat > keystore.properties <<EOF
          storeFile=keystore/minibgm-release.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
            echo "keystore restored"
          else
            echo "SIGNING_KEYSTORE_BASE64 not set, release falls back to debug signing"
          fi

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-artifacts
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/MiniBgm-${{ github.ref_name }}-release-unsigned.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/MiniBgm-${{ github.ref_name }}-release.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*
          generate_release_notes: true
